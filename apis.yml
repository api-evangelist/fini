aid: fini
name: Fini
description: >-
  Fini AI provides self-improving AI agents for enterprise customer support across voice, chat, and
  email. Built on a RAGless retrieval engine, the Fini Agent Loop, a self-updating Knowledge Atlas,
  and Agentic Actions, Fini understands customer intent, retrieves the right data, and takes action —
  resolving up to 90% of support tickets at 99% accuracy. It is purpose-built for regulated
  industries such as fintech, banking, healthcare, insurance, and e-commerce, with PII redaction,
  audit trails, and guardrails. Fini exposes a public v2 REST API for managing agents, conversations,
  knowledge (sources, articles, folders), rules, tags, and prompts, and for driving the agent loop
  through its Generate Answer endpoint. Backed by Y Combinator (S22) and Matrix Partners.
